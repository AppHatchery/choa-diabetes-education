<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="IE=edge" http-equiv="X-UA-Compatible" />
    <meta content="light" name="color-scheme" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>Snack recipes</title>
    <link rel="stylesheet" href="uikit.css" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Top half matches the header and the native nav bar above it, which ResourcePageViewController
         tints the same orange; bottom half matches the white panel */
      html {
        background: linear-gradient(#f58220 50%, #ffffff 50%);
        min-height: 100%;
      }

      body {
        margin: 0;
        background: transparent;
      }

      .recipes-header {
        position: relative;
        display: flex;
        align-items: center;
        min-height: 180px;
        padding: 0 20px;
<!--        background: radial-gradient(circle at 85% 70%, #f9a65a 0%, rgba(245, 130, 32, 0) 55%), #f58220;-->
        overflow: hidden;
      }

      .recipes-header h1 {
        position: relative;
        z-index: 1;
        max-width: 55%;
        margin: 0;
        font-family: NunitoRegular, Roboto, sans-serif !important;
        font-size: 28px;
        line-height: 36px;
        color: #ffffff;
      }

      /* Will stands on the panel's top edge */
      .recipes-header-will {
        position: absolute;
        right: 16px;
        bottom: 0;
        height: 172px;
        width: auto;
      }

      /* The Halloween Will only shows while the app's Halloween theme is on */
      .recipes-header-will.halloween,
      .halloween .recipes-header-will.regular {
        display: none;
      }

      .halloween .recipes-header-will.halloween {
        display: block;
      }

      .recipes-panel {
        position: relative;
        min-height: calc(100vh - 180px);
        margin-top: -1px;
        padding: 24px 20px 32px;
        background: #ffffff;
        border-radius: 20px 20px 0 0;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <header class="recipes-header">
      <h1>Snack recipes</h1>
      <img class="recipes-header-will regular" src="snack_recipes/will_food.png" alt="" />
      <img class="recipes-header-will halloween" src="snack_recipes/halloween_will_fork.png" alt="" />
    </header>

    <main class="recipes-panel">
      <div class="recipe-grid">
        <a class="recipe-card" href="egg_frittata_muffins.html">
          <img src="snack_recipes/egg_frittata_muffins.png" alt="Egg frittata muffins" />
          <div class="recipe-card-body">
            <p class="recipe-card-title">Egg frittata muffins</p>
            <p class="recipe-card-meta">3g carbs &middot; 172 cal</p>
          </div>
        </a>
        <a class="recipe-card" href="no_bake_granola_bar.html">
          <img src="snack_recipes/no_bake_granola_bar.png" alt="No bake granola bar" />
          <div class="recipe-card-body">
            <p class="recipe-card-title">No bake granola bar</p>
            <p class="recipe-card-meta">25g carbs &middot; 230 cal</p>
          </div>
        </a>
        <a class="recipe-card" href="almond_crusted_chicken_fingers.html">
          <img src="snack_recipes/almond_crusted_chicken_fingers.png" alt="Almond crusted chicken fingers" />
          <div class="recipe-card-body">
            <p class="recipe-card-title">Almond crusted chicken fingers</p>
            <p class="recipe-card-meta">8g carbs &middot; 277 cal</p>
          </div>
        </a>
        <a class="recipe-card" href="brown_rice.html">
          <img src="snack_recipes/brown_rice.png" alt="Brown rice" />
          <div class="recipe-card-body">
            <p class="recipe-card-title">Brown rice</p>
            <p class="recipe-card-meta">23g carbs &middot; 113 cal</p>
          </div>
        </a>
      </div>
    </main>
  </body>
  <script src="uikit.js"></script>
</html>
